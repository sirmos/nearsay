<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs | Nearsay</title>
<meta name="description" content="Every Nearsay escrow on NEAR testnet with its settlement receipt and proof trail.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Oxanium:wght@500;600;700&family=Spectral:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="jobs" data-accent="teal">
<main>
<section class="pagehead">
  <div class="rosette" id="rosetteart"></div>
  <div class="wrap two">
    <div>
      <p class="kicker">Escrow ledger</p>
      <h1>Jobs</h1>
      <p class="lede">Every job is an escrow on testnet. Pick a job number in the table to put it on the receipt and the proof trail.</p>
    </div>
    <aside class="slip" id="slip" aria-live="polite"></aside>
  </div>
</section>
<section class="wrap railwrap"><div class="railhead" id="railhead"></div><ol class="rail" id="rail"></ol></section>
<section class="wrap"><div id="answerbox"></div></section>
<section class="wrap">
  <div class="tools"><h2 class="sec" style="margin:0">All jobs</h2><input type="search" id="jobsearch" placeholder="Search by account, number or status" aria-label="Search jobs"></div>
  <div class="card scroll" id="jobtable"></div>
</section>
</main>
<script src="config.js"></script>
<script src="chrome.js"></script>
<script src="app.js"></script>
</body>
</html>
